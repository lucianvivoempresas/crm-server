<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>CRM Energia</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/energia-clean.css?v=20260625">
</head>
<body>
  <div id="boot" class="boot">
    <div class="brand-mark">⚡</div>
    <strong>CRM Energia</strong>
    <span>Carregando dados do banco...</span>
  </div>

  <section id="login-screen" class="login hidden">
    <div class="login-panel">
      <div class="brand-row">
        <div class="brand-mark">⚡</div>
        <div>
          <h1>CRM Energia</h1>
          <p>Gestão de vendas</p>
        </div>
      </div>
      <form id="login-form" class="stack">
        <label>Login
          <input id="login-user" autocomplete="username" required>
        </label>
        <label>Senha
          <input id="login-pass" type="password" autocomplete="current-password" required>
        </label>
        <p id="login-error" class="form-error"></p>
        <button class="btn primary" type="submit">Entrar</button>
      </form>
    </div>
  </section>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand-row sidebar-brand">
        <div class="brand-mark">⚡</div>
        <div>
          <strong>CRM Energia</strong>
          <span>Gestão de vendas</span>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="user-box">
        <div class="avatar" id="user-avatar">U</div>
        <div>
          <strong id="user-name">Usuário</strong>
          <span id="user-role">Perfil</span>
        </div>
        <button id="logout-btn" class="icon-btn" title="Sair">↪</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menu-btn" class="icon-btn mobile-only" title="Menu">☰</button>
        <div>
          <h2 id="page-title">Dashboard</h2>
          <p id="page-subtitle">Visão geral</p>
        </div>
        <div id="page-actions" class="page-actions"></div>
      </header>
      <div id="content" class="content"></div>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <header>
        <h3 id="modal-title"></h3>
        <button id="modal-close" class="icon-btn" title="Fechar">×</button>
      </header>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="/js/energia-clean.js?v=20260625" defer></script>
</body>
</html>
